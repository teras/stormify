# Stormify schema-sync default configuration.
#
# This file is bundled inside the schema-sync jar. On first launch the tool
# copies it to `.schema-sync.toml` in your project root. From that point on
# you own it — the tool never overwrites your edits.
#
# Two main sections:
#   [[slots.<category>]]   Slot definitions (≤ 9 per category). Mark exactly
#                          one slot per category with `default = true` — that
#                          slot is the fallback when the classifier (trained
#                          fresh each session from your project's SYNCED
#                          columns) has no signal for a column name.
#   [defaults]             DDL templates for deterministic Kotlin types.

# Maps Kotlin property names to DB column names. Match what your stormify
# runtime is configured for. Valid values:
#   "LOWER_CASE_WITH_UNDERSCORES"   userName ↔ user_name (stormify default)
#   "UPPER_CASE_WITH_UNDERSCORES"   userName ↔ USER_NAME
#   "CAMEL_CASE"                    userName ↔ userName  (no transformation)
namingPolicy = "LOWER_CASE_WITH_UNDERSCORES"

# === Defaults ==============================================================

[defaults]
# Base profile (SQL standard / postgres-leaning). Overridden per dialect below.
booleanDdl     = "BOOLEAN"
localDateDdl   = "DATE"
localTimeDdl   = "TIME"
localDateTimeDdl = "TIMESTAMP"
instantDdl     = "TIMESTAMP WITH TIME ZONE"
byteArrayDdl   = "BLOB"
charArrayDdl   = "CLOB"
uuidDdl        = "UUID"
enumOrdinalDdl = "SMALLINT"
pkIntDdl       = "INT"
pkLongDdl      = "BIGINT"
pkAutoIntDdl   = "INT GENERATED BY DEFAULT AS IDENTITY"
pkAutoLongDdl  = "BIGINT GENERATED BY DEFAULT AS IDENTITY"

# Auto-defaults emitted as SQL DEFAULT when a NOT NULL field has no entity
# initializer. Empty string disables — migration falls back to TODO comment.
autoDefaultText        = "''"
autoDefaultInt         = "0"
autoDefaultDecimal     = "0"
autoDefaultBoolean     = "FALSE"
autoDefaultLocalDate   = "CURRENT_DATE"
autoDefaultLocalTime   = "CURRENT_TIME"
autoDefaultLocalDateTime = "CURRENT_TIMESTAMP"
autoDefaultInstant     = "CURRENT_TIMESTAMP"
autoDefaultUuid        = ""
autoDefaultBytes       = ""

[defaults.postgresql]
byteArrayDdl   = "BYTEA"
charArrayDdl   = "TEXT"

[defaults.mysql]
booleanDdl     = "TINYINT(1)"
localDateTimeDdl = "DATETIME"
instantDdl     = "TIMESTAMP"
byteArrayDdl   = "LONGBLOB"
charArrayDdl   = "LONGTEXT"
uuidDdl        = "CHAR(36)"
pkAutoIntDdl   = "INT AUTO_INCREMENT"
pkAutoLongDdl  = "BIGINT AUTO_INCREMENT"
autoDefaultBoolean = "0"

[defaults.mariadb]
booleanDdl     = "TINYINT(1)"
localDateTimeDdl = "DATETIME"
instantDdl     = "TIMESTAMP"
byteArrayDdl   = "LONGBLOB"
charArrayDdl   = "LONGTEXT"
uuidDdl        = "CHAR(36)"
pkAutoIntDdl   = "INT AUTO_INCREMENT"
pkAutoLongDdl  = "BIGINT AUTO_INCREMENT"
autoDefaultBoolean = "0"

[defaults.oracle]
booleanDdl     = "NUMBER(1)"
localTimeDdl   = "TIMESTAMP"
byteArrayDdl   = "BLOB"
charArrayDdl   = "CLOB"
uuidDdl        = "RAW(16)"
enumOrdinalDdl = "NUMBER(5)"
pkIntDdl       = "NUMBER(10)"
pkLongDdl      = "NUMBER(19)"
pkAutoIntDdl   = "NUMBER(10) GENERATED BY DEFAULT AS IDENTITY"
pkAutoLongDdl  = "NUMBER(19) GENERATED BY DEFAULT AS IDENTITY"
autoDefaultBoolean = "0"

[defaults.mssql]
booleanDdl     = "BIT"
localDateTimeDdl = "DATETIME2"
instantDdl     = "DATETIMEOFFSET"
byteArrayDdl   = "VARBINARY(MAX)"
charArrayDdl   = "VARCHAR(MAX)"
uuidDdl        = "UNIQUEIDENTIFIER"
pkAutoIntDdl   = "INT IDENTITY(1,1)"
pkAutoLongDdl  = "BIGINT IDENTITY(1,1)"
autoDefaultBoolean = "0"
autoDefaultLocalTime = "CAST('00:00:00' AS TIME)"

[defaults.sqlite]
booleanDdl     = "INTEGER"
localDateDdl   = "TEXT"
localTimeDdl   = "TEXT"
localDateTimeDdl = "TEXT"
instantDdl     = "TEXT"
charArrayDdl   = "TEXT"
uuidDdl        = "TEXT"
pkIntDdl       = "INTEGER"
pkLongDdl      = "INTEGER"
pkAutoIntDdl   = "INTEGER PRIMARY KEY AUTOINCREMENT"
pkAutoLongDdl  = "INTEGER PRIMARY KEY AUTOINCREMENT"
autoDefaultBoolean = "0"
autoDefaultLocalDate = "(date('now'))"
autoDefaultLocalTime = "(time('now'))"
autoDefaultLocalDateTime = "(datetime('now'))"
autoDefaultInstant = "(datetime('now'))"

# === Text slots ============================================================

[[slots.text]]
name = "char"
length = 1

[[slots.text]]
name = "short"
length = 10

[[slots.text]]
name = "name"
length = 50

[[slots.text]]
name = "tweet"
length = 150

[[slots.text]]
name = "line"
length = 200
default = true

[[slots.text]]
name = "page"
length = 1000

[[slots.text]]
name = "text"
# no `length` key → unbounded TEXT/CLOB

# === Integral slots ========================================================

[[slots.integral]]
name = "flag"
digits = 1

[[slots.integral]]
name = "percent"
digits = 2

[[slots.integral]]
name = "permille"
digits = 3

[[slots.integral]]
name = "int"
digits = 10
default = true

[[slots.integral]]
name = "long"
digits = 19

# === Decimal slots =========================================================

[[slots.decimal]]
name = "small"
precision = 3
scale = 2

[[slots.decimal]]
name = "tenth"
precision = 5
scale = 1

[[slots.decimal]]
name = "money"
precision = 14
scale = 2
default = true

[[slots.decimal]]
name = "volume"
precision = 11
scale = 3

[[slots.decimal]]
name = "precise"
precision = 12
scale = 4

[[slots.decimal]]
name = "ppm"
precision = 10
scale = 5

[[slots.decimal]]
name = "geo"
precision = 9
scale = 6

[[slots.decimal]]
name = "nano"
precision = 15
scale = 7

[[slots.decimal]]
name = "rate"
precision = 19
scale = 8

