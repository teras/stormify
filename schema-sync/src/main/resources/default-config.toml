# Stormify schema-sync default configuration.
#
# This file is bundled inside the schema-sync jar. On first launch the tool
# copies it to `.schema-sync.toml` in your project root. From that point on
# you own it — the tool never overwrites your edits.
#
# Three sections:
#   [[slots.<category>]]   Slot definitions (≤ 9 per category).
#   [[seeds.<category>]]   Seed vocabularies, one entry per slot.

# === Text slots ============================================================

[[slots.text]]
name = "char"
length = 1

[[slots.text]]
name = "short"
length = 10

[[slots.text]]
name = "name"
length = 50

[[slots.text]]
name = "tweet"
length = 150

[[slots.text]]
name = "line"
length = 200

[[slots.text]]
name = "page"
length = 1000

[[slots.text]]
name = "text"
# no `length` key → unbounded TEXT/CLOB

# === Integral slots ========================================================

[[slots.integral]]
name = "flag"
digits = 1

[[slots.integral]]
name = "percent"
digits = 2

[[slots.integral]]
name = "permille"
digits = 3

[[slots.integral]]
name = "int"
digits = 10

[[slots.integral]]
name = "long"
digits = 19

# === Decimal slots =========================================================

[[slots.decimal]]
name = "small"
precision = 3
scale = 2

[[slots.decimal]]
name = "tenth"
precision = 5
scale = 1

[[slots.decimal]]
name = "money"
precision = 14
scale = 2

[[slots.decimal]]
name = "volume"
precision = 11
scale = 3

[[slots.decimal]]
name = "precise"
precision = 12
scale = 4

[[slots.decimal]]
name = "ppm"
precision = 10
scale = 5

[[slots.decimal]]
name = "geo"
precision = 9
scale = 6

[[slots.decimal]]
name = "nano"
precision = 15
scale = 7

[[slots.decimal]]
name = "rate"
precision = 19
scale = 8

# === Seed vocabularies =====================================================
# These give the classifier a useful cold start. Add your own column names
# here in the language and convention of your project — anything you add is
# treated like a confirmed assignment to that slot.

