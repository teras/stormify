site_name: Stormify
site_url: https://stormify.org/docs/
repo_url: https://github.com/teras/stormify
docs_dir: src
site_dir: build/docs

extra:
  generator: false
  homepage: https://stormify.org/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

theme:
  name: material
  accent: "light-blue"
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        text: Switch to Dark Mode
      primary: "blue"
    - scheme: slate
      toggle:
        icon: material/weather-night
        text: Switch to Light Mode
      primary: "black"
  logo: logo.png
  favicon: logo.png
  icon:
    repo: material/github
  features:
    - navigation.top
    - content.tabs.link

extra_javascript:
  - js/tab-fallback.js

nav:
  - Welcome: README.md
  - Core: Core_concepts.md
  - Advanced: Advanced_topics.md
  - Configuration: Database_Configuration.md
  - KDBC:
    - Overview: KDBC_Overview.md
    - C Guide: KDBC_C_Guide.md
    - Kotlin Guide: KDBC_Kotlin_Guide.md
    - C API Reference: kdbc-c/html/index.html
  - V1 to V2: Migration_V1_to_V2.md
  - Contributing: Contributing.md
  - JavaDoc: javadoc/index.html
  - Kotlin API: kotlin/index.html
