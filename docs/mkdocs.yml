site_name: !ENV [STORMIFY_VERSION_NAME, 'Stormify']
repo_url: https://github.com/teras/stormify
docs_dir: src
site_dir: build/docs

extra:
  generator: false
  homepage: https://stormify.org/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

theme:
  name: material
  accent: "light-blue"
  palette:
    - scheme: default
      toggle:
        icon: material/weather-sunny
        text: Switch to Dark Mode
      primary: "blue"
    - scheme: slate
      toggle:
        icon: material/weather-night
        text: Switch to Light Mode
      primary: "black"
  logo: logo.png
  favicon: logo.png
  icon:
    repo: material/github
  features:
    - navigation.top
    - content.tabs.link

extra_css:
  - stylesheets/code-highlight.css
  - stylesheets/tables.css

extra_javascript:
  - js/tab-fallback.js

nav:
  - Getting Started:
    - Overview: index.md
    - Installation: Installation.md
    - Database Configuration: Configuration.md
    - Entity Mapping: Entity_Mapping.md
    - Annotations: Annotations.md
  - Entities:
    - Primary Keys: Primary_Keys.md
    - References: References.md
    - Enums: Enums.md
  - Operations:
    - CRUD: CRUD.md
    - Transactions: Transactions.md
    - Raw Queries: Raw_Queries.md
    - PagedList: PagedList.md
    - PagedQuery: PagedQuery.md
  - Examples: Examples.md
  - Comparison: Comparison.md
  - KDBC:
    - Overview: KDBC_Overview.md
    - C Guide: KDBC_C_Guide.md
    - Kotlin Guide: KDBC_Kotlin_Guide.md
  - Migrating from v1 to v2: Migration_V1_to_V2.md
  - Contributing: Contributing.md
  - API Reference:
    - Stormify API: api-stormify/index.html
    - KDBC Kotlin API: api-kdbc-kotlin/index.html
    - KDBC C API: kdbc-c/html/index.html
