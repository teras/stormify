name: Build + Test

# ---------------------------------------------------------------------------
# Three-phase pipeline — build once, test everywhere, publish at the end.
#
# PHASE 1 (build-*):  produce publishable staging artifacts + ready-to-run
#                     native test binaries (test.kexe / test.exe). Each target
#                     is built on a host with the right toolchain. The output
#                     feeds BOTH the test phase and (when called from publish.yml)
#                     the final Maven Central upload.
#
# PHASE 2 (test-*):   matrix of tests per (target, database). Native tests
#                     download their prebuilt binary and execute against a
#                     docker/brew-managed database server. JVM/Android tests
#                     run Gradle directly (no gain from pre-building the JVM
#                     test jar — Gradle task graph rebuild is cheap).
#
# PHASE 3 (publish):  only when this workflow is called from publish.yml on
#                     a tag push. All staging-* artifacts are merged, the
#                     root KMP facade modules are re-signed, and the result
#                     is uploaded to the Central Portal.
#
# Tests gate the publish step. Nothing reaches Maven Central unless every
# target + DB combination is green.
# ---------------------------------------------------------------------------

on:
  push:
    tags-ignore: ['**']   # tags trigger publish.yml, which calls us
  pull_request:
  workflow_call:
  workflow_dispatch:

# ---------------------------------------------------------------------------
# CI environment notes (Ubuntu 24.04 / ubuntu-latest as of 2026-04)
#
# JDK 17:
#   Gradle 9.3.1 requires JVM 17+ to run. The project itself targets JVM 8
#   (jvmTarget = JVM_1_8 in build.gradle.kts) — JDK 17 is only needed as
#   the Gradle host JVM, not as a compilation target.
#
# Native database runtime libraries:
#   Client headers are vendored in kdbc/src/c/include/vendor/ and committed
#   to the repo — no -dev packages needed for compilation. Only runtime
#   shared libraries are required for test execution (dlopen).
#
#   Runtime packages installed via apt:
#     libsqlite3-0 · libpq5 · libmariadb3 · libsybdb5 · libaio1t64
#
#   libaio symlink: Ubuntu 24.04 renamed the library to libaio.so.1t64;
#   Oracle Instant Client still looks for libaio.so.1.
#
#   ODPI-C: Oracle Database Programming Interface. Built from source
#   (github.com/oracle/odpi, Apache 2.0) because no apt package exists.
#
#   Oracle Instant Client (basic-lite): ~72MB, no login required.
#   Provides libclntsh.so; ODPI-C loads it dynamically.
#
# Cross-compilers:
#   mingw-w64                → Windows x64 (kdbc C library)
#   gcc-aarch64-linux-gnu    → Linux ARM64 (kdbc C library)
#   (Kotlin/Native handles its own cross-compilation via bundled LLVM.)
# ---------------------------------------------------------------------------

# Env reused by several install steps — keeps each job's script short.
env:
  INSTALL_DB_RUNTIME: |
    sudo apt-get update
    sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3 libsybdb5 libaio1t64
    sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1
    git clone --depth 1 --branch v5.6.4 https://github.com/oracle/odpi.git /tmp/odpi
    make -C /tmp/odpi -j4
    sudo make -C /tmp/odpi install PREFIX=/usr/local
    rm -rf /tmp/odpi
    wget -q https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip -O /tmp/ic.zip
    sudo unzip -q /tmp/ic.zip -d /opt/oracle
    echo /opt/oracle/instantclient_* | sudo tee /etc/ld.so.conf.d/oracle.conf
    sudo ldconfig

jobs:

  # =========================================================================
  # PHASE 1 — BUILD
  # Each job produces (a) staging-deploy/ for Maven Central and, where
  # applicable, (b) a prebuilt native test binary uploaded as an artifact
  # for downstream test jobs to download and execute.
  # =========================================================================

  # JVM + Android + annproc publications. No test binary — JVM/Android tests
  # rebuild via Gradle in Phase 2 (no gain from pre-building a JVM test jar).
  build-jvm-android:
    runs-on: ubuntu-latest
    name: build · jvm+android+annproc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Publish JVM/Android/annproc publications to local staging
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          gradle \
            :stormify:publishJvmPublicationToLocalStagingRepository \
            :stormify:publishAndroidReleasePublicationToLocalStagingRepository \
            :kdbc:publishJvmPublicationToLocalStagingRepository \
            :kdbc:publishAndroidReleasePublicationToLocalStagingRepository \
            :logger:publishJvmPublicationToLocalStagingRepository \
            :logger:publishAndroidReleasePublicationToLocalStagingRepository \
            :annproc:publishAllPublicationsToLocalStagingRepository \
            --no-daemon --stacktrace

      - name: Read project version
        id: v
        run: |
          VERSION=$(grep -E '^version = ' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: staging-jvm-android
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 1
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_snapshot: ${{ steps.v.outputs.is_snapshot }}

  # Linux/mingw native targets in one Gradle invocation — all three use the
  # same ubuntu host + same cross-toolchain setup, so combining avoids
  # re-installing packages three times.
  build-linux-native:
    runs-on: ubuntu-latest
    name: build · linuxX64+linuxArm64+mingwX64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install cross-compilers
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Publish native publications + link test binaries
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          gradle \
            :stormify:publishLinuxX64PublicationToLocalStagingRepository \
            :stormify:publishLinuxArm64PublicationToLocalStagingRepository \
            :stormify:publishMingwX64PublicationToLocalStagingRepository \
            :stormify:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :kdbc:publishLinuxX64PublicationToLocalStagingRepository \
            :kdbc:publishLinuxArm64PublicationToLocalStagingRepository \
            :kdbc:publishMingwX64PublicationToLocalStagingRepository \
            :kdbc:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :logger:publishLinuxX64PublicationToLocalStagingRepository \
            :logger:publishLinuxArm64PublicationToLocalStagingRepository \
            :logger:publishMingwX64PublicationToLocalStagingRepository \
            :logger:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :stormify:linkDebugTestLinuxX64 \
            :stormify:linkDebugTestLinuxArm64 \
            :stormify:linkDebugTestMingwX64 \
            --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: staging-linux-native
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: test-bin-linuxX64
          path: stormify/build/bin/linuxX64/debugTest/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: test-bin-linuxArm64
          path: stormify/build/bin/linuxArm64/debugTest/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: test-bin-mingwX64
          path: stormify/build/bin/mingwX64/debugTest/
          if-no-files-found: error
          retention-days: 1

  # Apple targets — publications + macos native test binaries. iOS targets
  # have no ios*Test source set, so no test binary.
  build-apple:
    runs-on: macos-latest
    name: build · apple (macos+ios)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Publish apple publications + link macos test binaries + compile iOS
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          gradle \
            :stormify:publishIosArm64PublicationToLocalStagingRepository \
            :stormify:publishIosX64PublicationToLocalStagingRepository \
            :stormify:publishIosSimulatorArm64PublicationToLocalStagingRepository \
            :stormify:publishMacosArm64PublicationToLocalStagingRepository \
            :stormify:publishMacosX64PublicationToLocalStagingRepository \
            :stormify:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :kdbc:publishIosArm64PublicationToLocalStagingRepository \
            :kdbc:publishIosX64PublicationToLocalStagingRepository \
            :kdbc:publishIosSimulatorArm64PublicationToLocalStagingRepository \
            :kdbc:publishMacosArm64PublicationToLocalStagingRepository \
            :kdbc:publishMacosX64PublicationToLocalStagingRepository \
            :kdbc:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :logger:publishIosArm64PublicationToLocalStagingRepository \
            :logger:publishIosX64PublicationToLocalStagingRepository \
            :logger:publishIosSimulatorArm64PublicationToLocalStagingRepository \
            :logger:publishMacosArm64PublicationToLocalStagingRepository \
            :logger:publishMacosX64PublicationToLocalStagingRepository \
            :logger:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :stormify:linkDebugTestMacosArm64 \
            :stormify:compileKotlinIosArm64 \
            :stormify:compileKotlinIosX64 \
            :stormify:compileKotlinIosSimulatorArm64 \
            --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: staging-apple
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: test-bin-macosArm64
          path: stormify/build/bin/macosArm64/debugTest/
          if-no-files-found: error
          retention-days: 1

  # =========================================================================
  # PHASE 2 — TEST
  # Native tests download their prebuilt binary and execute it against a
  # live database. JVM/Android tests run Gradle directly (cheap).
  # =========================================================================

  test-jvm:
    needs: build-jvm-android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]
    name: test · jvm · ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests
        run: testing/test.sh jvm ${{ matrix.db }}

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  test-android:
    needs: build-jvm-android
    runs-on: ubuntu-latest
    name: test · android · robolectric
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Android unit tests
        run: testing/test.sh android

  # C native tests — don't use any Kotlin artifacts, but gate publish too.
  test-c-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]
    name: test · c-native · ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4
      - name: Install database runtime libraries
        run: eval "$INSTALL_DB_RUNTIME"
      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}
      - name: Run tests
        run: testing/test.sh native ${{ matrix.db }}
      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  test-linuxX64:
    needs: build-linux-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]
    name: test · linuxX64 · ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4

      - name: Install database runtime libraries
        run: eval "$INSTALL_DB_RUNTIME"

      - name: Download prebuilt test binary
        uses: actions/download-artifact@v4
        with:
          name: test-bin-linuxX64
          path: stormify/build/bin/linuxX64/debugTest/

      - name: Make test binary executable
        run: chmod +x stormify/build/bin/linuxX64/debugTest/test.kexe

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests (prebuilt binary)
        env:
          STORMIFY_TEST_DB: ${{ matrix.db }}
        run: stormify/build/bin/linuxX64/debugTest/test.kexe

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  test-linuxArm64:
    needs: build-linux-native
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # mysql5/mssql/oracle/oracle11 have no linux/arm64 Docker images.
        db: [sqlite, postgresql, postgresql9, mysql, mariadb]
    name: test · linuxArm64 · ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries (arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3 libsybdb5 libatomic1 libaio1t64
          sudo ln -sf /lib/aarch64-linux-gnu/libaio.so.1t64 /lib/aarch64-linux-gnu/libaio.so.1
          git clone --depth 1 --branch v5.6.4 https://github.com/oracle/odpi.git /tmp/odpi
          make -C /tmp/odpi -j4
          sudo make -C /tmp/odpi install PREFIX=/usr/local
          rm -rf /tmp/odpi
          wget -q https://download.oracle.com/otn_software/linux/instantclient/2370000/instantclient-basiclite-linux.arm64-23.7.0.25.01.zip -O /tmp/ic.zip
          sudo unzip -q /tmp/ic.zip -d /opt/oracle
          echo /opt/oracle/instantclient_* | sudo tee /etc/ld.so.conf.d/oracle.conf
          sudo ldconfig

      - name: Download prebuilt test binary
        uses: actions/download-artifact@v4
        with:
          name: test-bin-linuxArm64
          path: stormify/build/bin/linuxArm64/debugTest/

      - name: Make test binary executable
        run: chmod +x stormify/build/bin/linuxArm64/debugTest/test.kexe

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests (prebuilt binary)
        env:
          STORMIFY_TEST_DB: ${{ matrix.db }}
        run: stormify/build/bin/linuxArm64/debugTest/test.kexe

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  # mingwX64 tests — run the Windows test.exe under Wine on Linux. This avoids
  # Docker Desktop engine switching on Windows runners (Docker Desktop is not
  # preinstalled on windows-latest) and reuses the Linux docker-compose DB
  # infrastructure. Windows-native DLLs (libpq.dll, libmariadb.dll, libsybdb.dll,
  # oci.dll, …) are already vendored under kdbc/src/c/libs/mingw/ and copied
  # next to the test.exe by the Gradle build.
  test-mingwX64:
    needs: build-linux-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]
    name: test · mingwX64 · ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine and mingw cross-compiler
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wine wine32:i386 wine64 xvfb zstd mingw-w64 winetricks cabextract
          wine --version

      - name: Download prebuilt test binary
        uses: actions/download-artifact@v4
        with:
          name: test-bin-mingwX64
          path: stormify/build/bin/mingwX64/debugTest/

      - name: Fetch Windows runtime DLLs (upstream sources)
        run: .github/scripts/fetch-mingw-dlls.sh stormify/build/bin/mingwX64/debugTest

      - name: Install VC++ runtime in Wine prefix (Oracle needs VCRUNTIME140)
        if: matrix.db == 'oracle' || matrix.db == 'oracle11'
        env:
          WINEDEBUG: -all
        run: xvfb-run -a winetricks -q vcrun2019

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests (Wine)
        env:
          STORMIFY_TEST_DB: ${{ matrix.db }}
          # err+module gives a one-line cause when a DLL fails to load.
          WINEDEBUG: -all,err+module,err+loaddll
        # Headless Wine under xvfb — otherwise Wine may try to open a display.
        run: |
          cd stormify/build/bin/mingwX64/debugTest
          xvfb-run -a wine ./test.exe

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  # macOS native tests — macos-latest is arm64. Intel (macosX64) intentionally
  # omitted: macos-13 runners are deprecated, Apple ended Intel hardware, and
  # Kotlin/Native's codegen path is identical between the two Mac targets.
  # Brew services host the DBs (no Docker on macOS without colima/VM).
  test-macosNative:
    needs: build-apple
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Excluded: oracle/oracle11/mssql (no macOS server exists),
        # mysql5/postgresql9 (no arm64 brew bottle as of 2026-04).
        db: [sqlite, postgresql, mysql, mariadb]
    name: test · macosArm64 · ${{ matrix.db }}
    # DYLD_LIBRARY_PATH needed job-level — keg-only brew libs aren't on the
    # default loader path. Only the matching directory exists per matrix entry;
    # dyld silently ignores missing entries.
    env:
      DYLD_LIBRARY_PATH: /opt/homebrew/opt/postgresql@15/lib:/opt/homebrew/opt/mariadb/lib:/opt/homebrew/opt/mysql/lib:/opt/homebrew/lib
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt test binary
        uses: actions/download-artifact@v4
        with:
          name: test-bin-macosArm64
          path: stormify/build/bin/macosArm64/debugTest/

      - name: Make test binary executable
        run: chmod +x stormify/build/bin/macosArm64/debugTest/test.kexe

      - name: Start database (brew services)
        if: matrix.db != 'sqlite'
        run: testing/macos-services.sh up ${{ matrix.db }}

      - name: Run tests (prebuilt binary)
        env:
          STORMIFY_TEST_DB: ${{ matrix.db }}
        run: stormify/build/bin/macosArm64/debugTest/test.kexe

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/macos-services.sh down ${{ matrix.db }}

  # macOS JVM tests — same 4 DBs as macos-native (brew services limit).
  test-macosJvm:
    needs: build-jvm-android
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, mysql, mariadb]
    name: test · macos-jvm · ${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4

      # JDK 8 for test JVM (matches jvmTarget); JDK 17 to run Gradle.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Start database (brew services)
        if: matrix.db != 'sqlite'
        run: testing/macos-services.sh up ${{ matrix.db }}

      # Bypass testing/test.sh's require_db check (docker-compose-based). brew
      # services exposes the same ports as docker-compose.yml, so the same
      # hikari.properties works. We pass the DB-specific config explicitly,
      # otherwise TestDataSourceFactory falls back to an in-memory SQLite.
      - name: Run JVM tests
        run: |
          CONFIG="$(pwd)/testing/config/${{ matrix.db }}/hikari.properties"
          gradle :stormify:jvmTest \
            -Dstormify.test.db=${{ matrix.db }} \
            ${CONFIG:+-Dstormify.test.config="$CONFIG"} \
            --console=plain --no-daemon

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/macos-services.sh down ${{ matrix.db }}

  # Example consumer projects — validate that published artifacts are usable
  # from a real consumer build. Uses publishToMavenLocal instead of downloading
  # staging-* artifacts so we exercise the full POM/module resolution path.
  test-examples:
    needs: [build-jvm-android, build-linux-native]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [java, kotlin-jvm, kotlin-linux, kotlin-multiplatform]
    name: test · example · ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install cross-compilers + runtime libs
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-0 libpq5 libmariadb3 libsybdb5 libaio1t64 \
            mingw-w64 gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1

      - name: Publish to Maven Local
        run: gradle publishToMavenLocal --console=plain

      - name: Run example
        run: testing/test.sh examples ${{ matrix.example }}
