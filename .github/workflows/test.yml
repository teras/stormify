name: Database Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            profile: ""
            image: ""
          - db: mysql
            profile: mysql
            image: mysql:8.0
          - db: mysql-old
            profile: mysql-old
            image: mysql:5.7
          - db: mariadb
            profile: mariadb
            image: mariadb:11
          - db: mariadb-old
            profile: mariadb-old
            image: mariadb:10.2
          - db: postgresql
            profile: postgresql
            image: postgres:16
          - db: postgresql-old
            profile: postgresql-old
            image: postgres:10
          - db: oracle
            profile: oracle
            image: gvenzl/oracle-xe:21-slim
          - db: oracle-old
            profile: oracle-old
            image: gvenzl/oracle-xe:11-slim
          - db: mssql
            profile: mssql
            image: mcr.microsoft.com/mssql/server:2022-latest

    name: ${{ matrix.db }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Docker image
        if: matrix.image != ''
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar
          key: docker-${{ matrix.db }}-${{ matrix.image }}

      - name: Load cached Docker image
        if: matrix.image != ''
        run: |
          if [ -f /tmp/docker-image.tar ]; then
            docker load -i /tmp/docker-image.tar
          else
            docker pull ${{ matrix.image }}
            docker save ${{ matrix.image }} -o /tmp/docker-image.tar
          fi

      - name: Start database
        if: matrix.profile != ''
        working-directory: testing
        run: |
          docker compose --profile ${{ matrix.profile }} up -d
          ../testing/scripts/wait-for-db.sh ${{ matrix.db }}

      - name: Run db tests
        run: |
          CONFIG=""
          if [ "${{ matrix.db }}" != "sqlite" ]; then
            CONFIG="-Dstormify.test.config=$(pwd)/testing/config/${{ matrix.db }}/hikari.properties"
          fi
          gradle :db:test -Dstormify.test.db=${{ matrix.db }} $CONFIG

      - name: Run kotlin tests
        run: |
          CONFIG=""
          if [ "${{ matrix.db }}" != "sqlite" ]; then
            CONFIG="-Dstormify.test.config=$(pwd)/testing/config/${{ matrix.db }}/hikari.properties"
          fi
          gradle :kotlin:test -Dstormify.test.db=${{ matrix.db }} $CONFIG

      - name: Stop database
        if: matrix.profile != '' && always()
        working-directory: testing
        run: docker compose --profile ${{ matrix.profile }} down -v
