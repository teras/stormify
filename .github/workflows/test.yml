name: Database Tests

on:
  push:
  pull_request:

# ---------------------------------------------------------------------------
# CI environment notes (Ubuntu 24.04 / ubuntu-latest as of 2026-04)
#
# JDK 17:
#   Gradle 9.3.1 requires JVM 17+ to run. The project itself targets JVM 8
#   (jvmTarget = JVM_1_8 in build.gradle.kts) — JDK 17 is only needed as
#   the Gradle host JVM, not as a compilation target.
#
# Native database runtime libraries:
#   Database client headers are vendored in kdbc/src/c/include/vendor/ and
#   committed to the repo — no -dev packages are needed for compilation.
#   Only runtime shared libraries are required for test execution (dlopen).
#   Missing libraries cause graceful "driver not available" errors.
#
#   Runtime packages installed via apt:
#     - libsqlite3-0       → libsqlite3.so (SQLite)
#     - libpq5             → libpq.so (PostgreSQL)
#     - libmariadb3        → libmariadb.so (MariaDB/MySQL)
#     - libsybdb5          → libsybdb.so (MS SQL Server via FreeTDS)
#     - libaio1t64         → async I/O library required by Oracle IC
#
#   libaio symlink:
#     Ubuntu 24.04 transitioned to 64-bit time_t, renaming the library to
#     libaio.so.1t64. Oracle Instant Client still looks for libaio.so.1,
#     so we create a compatibility symlink.
#
#   ODPI-C (Oracle Database Programming Interface for C):
#     Not available as an Ubuntu apt package. Built from source
#     (github.com/oracle/odpi, Apache 2.0 license). The header (dpi.h) is
#     vendored; only the runtime library (libodpic.so) is needed here.
#     ODPI-C itself loads libclntsh.so from Oracle Instant Client.
#
#   Oracle Instant Client (basic-lite):
#     Free download from Oracle (~72MB, no login required). Provides
#     libclntsh.so (the OCI library that ODPI-C wraps). Installed to
#     /opt/oracle/ and registered via ldconfig so dlopen finds it.
#
# mingwX64 (Windows cross-compilation):
#   The mingw-w64 package provides the cross-compiler for building
#   libkdbc.a targeting Windows. Kotlin/Native handles its own
#   cross-compilation via its bundled LLVM toolchain.
#
# linuxArm64 (ARM64 cross-compilation):
#   The gcc-aarch64-linux-gnu package provides the cross-compiler for
#   building libkdbc.a targeting ARM64 Linux. The test binary runs on
#   an ubuntu-24.04-arm runner (native ARM64 GitHub Actions runner).
#   The -mno-outline-atomics flag is needed in the Makefile because
#   Kotlin/Native links with its own LLVM runtime, not libgcc.
# ---------------------------------------------------------------------------

jobs:
  jvm-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]

    name: jvm / ${{ matrix.db }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests
        run: testing/test.sh jvm ${{ matrix.db }}

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  native-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]

    name: native / ${{ matrix.db }}

    steps:
      - uses: actions/checkout@v4

      - name: Install database runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3 libsybdb5 libaio1t64
          # libaio compat symlink (see header comment)
          sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1
          # ODPI-C: build from source — only the runtime .so is needed (header is vendored)
          git clone --depth 1 --branch v5.6.4 https://github.com/oracle/odpi.git /tmp/odpi
          make -C /tmp/odpi -j4
          sudo make -C /tmp/odpi install PREFIX=/usr/local
          rm -rf /tmp/odpi
          # Oracle Instant Client basic-lite (see header comment)
          wget -q https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip -O /tmp/ic.zip
          sudo unzip -q /tmp/ic.zip -d /opt/oracle
          echo /opt/oracle/instantclient_* | sudo tee /etc/ld.so.conf.d/oracle.conf
          sudo ldconfig

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests
        run: testing/test.sh native ${{ matrix.db }}

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  linux-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]

    name: linux / ${{ matrix.db }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install database runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3 libsybdb5 libaio1t64
          sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1
          git clone --depth 1 --branch v5.6.4 https://github.com/oracle/odpi.git /tmp/odpi
          make -C /tmp/odpi -j4
          sudo make -C /tmp/odpi install PREFIX=/usr/local
          rm -rf /tmp/odpi
          wget -q https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip -O /tmp/ic.zip
          sudo unzip -q /tmp/ic.zip -d /opt/oracle
          echo /opt/oracle/instantclient_* | sudo tee /etc/ld.so.conf.d/oracle.conf
          sudo ldconfig

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests
        run: testing/test.sh linux ${{ matrix.db }}

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}

  android-test:
    runs-on: ubuntu-latest
    name: android / robolectric

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Android unit tests
        run: testing/test.sh android

  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [java, kotlin-jvm, kotlin-linux, kotlin-multiplatform]

    name: example / ${{ matrix.example }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # publishToMavenLocal compiles all targets including mingwX64, so the
      # cross-compiler is needed. Runtime libraries are needed for linuxX64
      # examples that dlopen database drivers.
      - name: Install runtime libraries and cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3 libsybdb5 libaio1t64 mingw-w64
          sudo ln -sf /lib/x86_64-linux-gnu/libaio.so.1t64 /lib/x86_64-linux-gnu/libaio.so.1
          git clone --depth 1 --branch v5.6.4 https://github.com/oracle/odpi.git /tmp/odpi
          make -C /tmp/odpi -j4
          sudo make -C /tmp/odpi install PREFIX=/usr/local
          rm -rf /tmp/odpi
          wget -q https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip -O /tmp/ic.zip
          sudo unzip -q /tmp/ic.zip -d /opt/oracle
          echo /opt/oracle/instantclient_* | sudo tee /etc/ld.so.conf.d/oracle.conf
          sudo ldconfig

      - name: Publish to Maven Local
        run: gradle publishToMavenLocal --console=plain

      - name: Run example
        run: testing/test.sh examples ${{ matrix.example }}

  # ---------------------------------------------------------------------------
  # Windows native (mingwX64) — cross-compile on Linux, test on Windows
  # ---------------------------------------------------------------------------

  windows-native-build:
    runs-on: ubuntu-latest
    name: windows-native / build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cross-compile libkdbc.a for mingwX64
        run: make -C kdbc/src/c TARGET=mingw BUILDDIR=build-mingw lib

      - name: Build mingwX64 test binary
        run: gradle :stormify:linkDebugTestMingwX64 --console=plain

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: mingw-test-binary
          path: stormify/build/bin/mingwX64/debugTest/test.exe
          retention-days: 1

  windows-native-test:
    runs-on: windows-latest
    needs: windows-native-build
    name: windows-native / sqlite

    steps:
      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: mingw-test-binary

      - name: Download SQLite DLL
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-dll-win-x64-3470200.zip" -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath .

      - name: Run tests
        env:
          STORMIFY_TEST_DB: sqlite
        run: .\test.exe

  # ---------------------------------------------------------------------------
  # Linux ARM64 (linuxArm64) — cross-compile on Linux x64, test on ARM64
  # ---------------------------------------------------------------------------

  linux-arm64-build:
    runs-on: ubuntu-latest
    name: linux-arm64 / build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile libkdbc.a for linuxArm64
        run: make -C kdbc/src/c TARGET=arm64 BUILDDIR=build-arm64 lib

      - name: Build linuxArm64 test binary
        run: gradle :stormify:linkDebugTestLinuxArm64 --console=plain

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-binary
          path: stormify/build/bin/linuxArm64/debugTest/test.kexe
          retention-days: 1

  linux-arm64-test:
    runs-on: ubuntu-24.04-arm
    needs: linux-arm64-build
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql, postgresql9, mysql, mysql5, mariadb, oracle, oracle11, mssql]

    name: linux-arm64 / ${{ matrix.db }}

    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libpq5 libmariadb3 libsybdb5 libatomic1 libaio1t64
          sudo ln -sf /lib/aarch64-linux-gnu/libaio.so.1t64 /lib/aarch64-linux-gnu/libaio.so.1
          git clone --depth 1 --branch v5.6.4 https://github.com/oracle/odpi.git /tmp/odpi
          make -C /tmp/odpi -j4
          sudo make -C /tmp/odpi install PREFIX=/usr/local
          rm -rf /tmp/odpi
          wget -q https://download.oracle.com/otn_software/linux/instantclient/2370000/instantclient-basiclite-linux.arm64-23.7.0.25.01.zip -O /tmp/ic.zip
          sudo unzip -q /tmp/ic.zip -d /opt/oracle
          echo /opt/oracle/instantclient_* | sudo tee /etc/ld.so.conf.d/oracle.conf
          sudo ldconfig

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: arm64-test-binary
          path: stormify/build/bin/linuxArm64/debugTest/

      - name: Make test binary executable
        run: chmod +x stormify/build/bin/linuxArm64/debugTest/test.kexe

      - name: Start database
        if: matrix.db != 'sqlite'
        run: testing/test.sh up ${{ matrix.db }}

      - name: Run tests
        run: STORMIFY_PREBUILT=1 testing/test.sh linux-arm64 ${{ matrix.db }}

      - name: Stop database
        if: always() && matrix.db != 'sqlite'
        run: testing/test.sh down ${{ matrix.db }}
