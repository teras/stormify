name: Publish snapshot to Maven Central

# Dual-host build with merged root module:
#   - Linux runner builds JVM, Android, linuxX64, linuxArm64, mingwX64
#   - macOS runner builds the apple targets (macos*, ios*)
# Each host produces its own staging tree with platform-specific Maven coords
# AND its own root *.module file (only declaring its own target variants). The
# merge job unions the two root .module files (variants array union), re-signs,
# and uploads to the Central Portal snapshots repository.
#
# Tests run in parallel; publish gates on tests + both build hosts.

on:
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install cross-compilers for mingw and linuxArm64
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Publish JVM/Android/Linux/Mingw targets to local staging
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          gradle \
            :stormify:publishAllPublicationsToLocalStagingRepository \
            :kdbc:publishAllPublicationsToLocalStagingRepository \
            :logger:publishAllPublicationsToLocalStagingRepository \
            :annproc:publishAllPublicationsToLocalStagingRepository \
            --no-daemon --stacktrace

      - name: Upload Linux staging
        uses: actions/upload-artifact@v4
        with:
          name: staging-linux
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Publish Apple targets to local staging
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          gradle \
            :stormify:publishIosArm64PublicationToLocalStagingRepository \
            :stormify:publishIosX64PublicationToLocalStagingRepository \
            :stormify:publishIosSimulatorArm64PublicationToLocalStagingRepository \
            :stormify:publishMacosArm64PublicationToLocalStagingRepository \
            :stormify:publishMacosX64PublicationToLocalStagingRepository \
            :stormify:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :kdbc:publishIosArm64PublicationToLocalStagingRepository \
            :kdbc:publishIosX64PublicationToLocalStagingRepository \
            :kdbc:publishIosSimulatorArm64PublicationToLocalStagingRepository \
            :kdbc:publishMacosArm64PublicationToLocalStagingRepository \
            :kdbc:publishMacosX64PublicationToLocalStagingRepository \
            :kdbc:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            :logger:publishIosArm64PublicationToLocalStagingRepository \
            :logger:publishIosX64PublicationToLocalStagingRepository \
            :logger:publishIosSimulatorArm64PublicationToLocalStagingRepository \
            :logger:publishMacosArm64PublicationToLocalStagingRepository \
            :logger:publishMacosX64PublicationToLocalStagingRepository \
            :logger:publishKotlinMultiplatformPublicationToLocalStagingRepository \
            --no-daemon --stacktrace

      - name: Upload macOS staging
        uses: actions/upload-artifact@v4
        with:
          name: staging-macos
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 1

  merge-and-publish:
    needs: [tests, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux staging
        uses: actions/download-artifact@v4
        with:
          name: staging-linux
          path: staging-linux/

      - name: Download macOS staging
        uses: actions/download-artifact@v4
        with:
          name: staging-macos
          path: staging-macos/

      - name: Merge stagings (root .module variants union, prefer macOS metadata jars)
        run: |
          python3 .github/scripts/merge-staging.py staging-linux staging-macos staging-merged

      - name: Re-sign merged root .module files
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          # Re-sign root .module files for stormify/kdbc/logger (annproc isn't KMP).
          # Per-target modules (stormify-jvm, stormify-macosarm64, ...) keep their
          # original signatures since their content was never modified.
          for art in stormify kdbc logger; do
            find "staging-merged/onl/ycode/$art" -maxdepth 3 -name "$art-*.module" | while read f; do
              echo "  re-signing $f"
              rm -f "$f.asc" "$f.md5" "$f.sha1" "$f.sha256" "$f.sha512"
              gpg --batch --pinentry-mode loopback --passphrase "$SIGNING_KEY_PASSWORD" \
                  --local-user "$KEY_ID" --armor --detach-sign "$f"
              md5sum    "$f" | awk '{print $1}' > "$f.md5"
              sha1sum   "$f" | awk '{print $1}' > "$f.sha1"
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
              sha512sum "$f" | awk '{print $1}' > "$f.sha512"
            done
          done

      - name: Upload to snapshots repo
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASS: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd staging-merged
          BASE="https://central.sonatype.com/repository/maven-snapshots"
          # Parallel uploads: 16 concurrent PUTs reuse TCP/auth handshakes and
          # collapse upload time from ~minutes to ~seconds for hundreds of files.
          export USER PASS BASE
          upload_one() {
            f="$1"
            REL="${f#./}"
            CODE=$(curl -sS -u "$USER:$PASS" -T "$f" -o /dev/null -w '%{http_code}' "$BASE/$REL")
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "FAILED ($CODE): $REL"
              return 1
            fi
            echo "OK $CODE  $REL"
          }
          export -f upload_one
          # Whitelist of known Maven artifact extensions — keeps stray files
          # (build logs, .DS_Store, etc.) out of the upload.
          find . -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \
                            -o -name '*.klib' -o -name '*.aar' -o -name '*.json' \
                            -o -name '*.asc' -o -name '*.md5' -o -name '*.sha1' \
                            -o -name '*.sha256' -o -name '*.sha512' \
                            -o -name 'maven-metadata.xml*' \) -print0 \
            | xargs -0 -n1 -P16 bash -c 'upload_one "$0"' || {
                echo "One or more uploads failed"; exit 1;
              }
          echo ""
          echo "Snapshot published to $BASE/"
