name: Publish to Maven Central

# Publish workflow — reuses test.yml for build + test, then adds the final
# upload step. The test.yml workflow_call produces three staging artifacts
# (staging-jvm-android, staging-linux-native, staging-apple); the publish
# job merges their root KMP facade modules, re-signs them, and uploads.
#
# Version ending in -SNAPSHOT → per-file PUT to the Central Portal snapshots
# repo. Otherwise → zipped bundle uploaded as USER_MANAGED (manual approve).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Run the full build + test pipeline. Secrets are inherited so the build
  # jobs can sign the Maven Central artifacts they produce.
  build-and-test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JVM/Android/annproc staging
        uses: actions/download-artifact@v4
        with:
          name: staging-jvm-android
          path: staging-jvm-android/

      - name: Download linux-native staging
        uses: actions/download-artifact@v4
        with:
          name: staging-linux-native
          path: staging-linux-native/

      - name: Download apple staging
        uses: actions/download-artifact@v4
        with:
          name: staging-apple
          path: staging-apple/

      # Two-step merge. First combine the two Linux-side stagings into one
      # (they both produce root .module files with disjoint variant sets —
      # jvm/android vs linuxX64/linuxArm64/mingwX64). Then merge that with
      # the macOS staging for the final union.
      - name: Merge stagings
        run: |
          python3 .github/scripts/merge-staging.py \
            staging-jvm-android staging-linux-native staging-linux/
          python3 .github/scripts/merge-staging.py \
            staging-linux staging-apple staging/

      - name: Read project version
        id: v
        run: |
          VERSION=$(grep -E '^version = ' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-sign merged root .module files
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          # Only root KMP facade modules (stormify/kdbc/logger) were modified.
          # Per-target modules keep their original signatures — bytes unchanged.
          # annproc isn't KMP, so no root module to re-sign.
          for art in stormify kdbc logger; do
            find "staging/onl/ycode/$art" -maxdepth 3 -name "$art-*.module" | while read f; do
              parent_artifact=$(basename "$(dirname "$(dirname "$f")")")
              if [ "$parent_artifact" != "$art" ]; then continue; fi
              echo "  re-signing $f"
              rm -f "$f.asc" "$f.md5" "$f.sha1" "$f.sha256" "$f.sha512"
              gpg --batch --pinentry-mode loopback --passphrase "$SIGNING_KEY_PASSWORD" \
                  --local-user "$KEY_ID" --armor --detach-sign "$f"
              md5sum    "$f" | awk '{print $1}' > "$f.md5"
              sha1sum   "$f" | awk '{print $1}' > "$f.sha1"
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
              sha512sum "$f" | awk '{print $1}' > "$f.sha512"
            done
          done

      - name: Upload snapshot to Central Portal snapshots repo
        if: steps.v.outputs.is_snapshot == 'true'
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASS: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd staging
          BASE="https://central.sonatype.com/repository/maven-snapshots"
          export USER PASS BASE
          upload_one() {
            f="$1"
            REL="${f#./}"
            CODE=$(curl -sS -u "$USER:$PASS" -T "$f" -o /dev/null -w '%{http_code}' "$BASE/$REL")
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "FAILED ($CODE): $REL"
              return 1
            fi
            echo "OK $CODE  $REL"
          }
          export -f upload_one
          find . -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \
                            -o -name '*.klib' -o -name '*.aar' -o -name '*.json' \
                            -o -name '*.asc' -o -name '*.md5' -o -name '*.sha1' \
                            -o -name '*.sha256' -o -name '*.sha512' \
                            -o -name 'maven-metadata.xml*' \) -print0 \
            | xargs -0 -n1 -P16 bash -c 'upload_one "$0"' || {
                echo "One or more uploads failed"; exit 1;
              }
          echo "Snapshot ${{ steps.v.outputs.version }} published."

      - name: Bundle and upload release to Central Portal (USER_MANAGED)
        if: steps.v.outputs.is_snapshot == 'false'
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASS: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd staging && zip -r ../bundle.zip . && cd ..
          TOKEN=$(printf '%s:%s' "$USER" "$PASS" | base64 -w0)
          HTTP_CODE=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=stormify-${GITHUB_REF_NAME}&publishingType=USER_MANAGED")
          echo "HTTP $HTTP_CODE"
          cat response.txt
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi
          echo "Deployment staged. Approve at https://central.sonatype.com/publishing/deployments"
