name: Publish to Maven Central

# Single-host build on macOS — the only host that can produce every target
# (JVM, Android, linuxX64, linuxArm64, mingwX64, macos*, ios*) thanks to
# Kotlin/Native cross-compile + Homebrew GCC cross-toolchains. A single host
# means a single complete root KMP module, no merge hacks.
#
# Tests run in parallel with the build. Publish gates on both — nothing reaches
# Maven Central unless the test matrix is green.
#
# Version suffix `-SNAPSHOT` routes to the snapshots repo (mutable, auto);
# otherwise the bundle is uploaded to the Central Portal as USER_MANAGED
# (manual approve in the UI).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install cross-compile toolchains (Linux + MinGW)
        run: |
          brew tap messense/macos-cross-toolchains
          brew install x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu mingw-w64
          # The kdbc Makefile expects unprefixed `aarch64-linux-gnu-*` and
          # `x86_64-linux-gnu-*` names; messense ships them with the
          # `unknown-` prefix. Bridge with symlinks on PATH.
          mkdir -p $HOME/cross-bin
          ln -sf $(brew --prefix)/bin/aarch64-unknown-linux-gnu-gcc $HOME/cross-bin/aarch64-linux-gnu-gcc
          ln -sf $(brew --prefix)/bin/aarch64-unknown-linux-gnu-ar  $HOME/cross-bin/aarch64-linux-gnu-ar
          ln -sf $(brew --prefix)/bin/x86_64-unknown-linux-gnu-gcc  $HOME/cross-bin/x86_64-linux-gnu-gcc
          ln -sf $(brew --prefix)/bin/x86_64-unknown-linux-gnu-ar   $HOME/cross-bin/x86_64-linux-gnu-ar
          echo "$HOME/cross-bin" >> $GITHUB_PATH

      - name: Pre-build native C libraries for every target
        run: |
          cd kdbc/src/c
          make lib                                                # macOS host native
          make TARGET=linux  BUILDDIR=build-linux   lib           # Linux x64
          make TARGET=arm64  BUILDDIR=build-arm64   lib           # Linux ARM64
          make TARGET=mingw  BUILDDIR=build-mingw   lib           # Windows x64
          make TARGET=ios    BUILDDIR=build-ios     build-ios/libkdbc.a
          make TARGET=ios-sim BUILDDIR=build-ios-sim build-ios-sim/libkdbc.a

      - name: Publish all targets to local staging
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          gradle \
            :stormify:publishAllPublicationsToLocalStagingRepository \
            :kdbc:publishAllPublicationsToLocalStagingRepository \
            :logger:publishAllPublicationsToLocalStagingRepository \
            :annproc:publishAllPublicationsToLocalStagingRepository \
            --no-daemon --stacktrace

      - name: Read project version
        id: v
        run: |
          VERSION=$(grep -E '^version = ' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VERSION"

      - name: Upload staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging
          path: build/staging-deploy/
          if-no-files-found: error
          retention-days: 1

    outputs:
      is_snapshot: ${{ steps.v.outputs.is_snapshot }}
      version: ${{ steps.v.outputs.version }}

  publish:
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download staging
        uses: actions/download-artifact@v4
        with:
          name: staging
          path: staging/

      - name: Upload snapshot to Central Portal snapshots repo
        if: needs.build.outputs.is_snapshot == 'true'
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASS: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd staging
          BASE="https://central.sonatype.com/repository/maven-snapshots"
          export USER PASS BASE
          upload_one() {
            f="$1"
            REL="${f#./}"
            CODE=$(curl -sS -u "$USER:$PASS" -T "$f" -o /dev/null -w '%{http_code}' "$BASE/$REL")
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "FAILED ($CODE): $REL"
              return 1
            fi
            echo "OK $CODE  $REL"
          }
          export -f upload_one
          find . -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \
                            -o -name '*.klib' -o -name '*.aar' -o -name '*.json' \
                            -o -name '*.asc' -o -name '*.md5' -o -name '*.sha1' \
                            -o -name '*.sha256' -o -name '*.sha512' \
                            -o -name 'maven-metadata.xml*' \) -print0 \
            | xargs -0 -n1 -P16 bash -c 'upload_one "$0"' || {
                echo "One or more uploads failed"; exit 1;
              }
          echo ""
          echo "Snapshot ${{ needs.build.outputs.version }} published."

      - name: Bundle and upload release to Central Portal (USER_MANAGED)
        if: needs.build.outputs.is_snapshot == 'false'
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASS: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd staging && zip -r ../bundle.zip . && cd ..
          TOKEN=$(printf '%s:%s' "$USER" "$PASS" | base64 -w0)
          HTTP_CODE=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=stormify-${GITHUB_REF_NAME}&publishingType=USER_MANAGED")
          echo "HTTP $HTTP_CODE"
          cat response.txt
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi
          echo "Deployment staged. Approve at https://central.sonatype.com/publishing/deployments"
