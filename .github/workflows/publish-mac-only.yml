name: EXPERIMENTAL — Mac-only publish

# Single-host build: macOS runner cross-compiles every target (JVM, Android,
# linuxX64, linuxArm64, mingwX64, macos*, ios*) and uploads the complete
# staging tree. No merge step needed because there's only one staging.
#
# Goal: measure end-to-end timing vs the dual-host + merge approach. If the
# mac-only path is fast enough with parallel uploads, we drop the merge hack.
#
# Trigger manually. Overwrites 2.0.1-SNAPSHOT in the snapshots repo.

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install cross-compile toolchains (Linux + MinGW)
        run: |
          brew tap messense/macos-cross-toolchains
          brew install x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu mingw-w64
          # symlinks so the kdbc Makefile's expected names resolve
          # (it expects aarch64-linux-gnu-gcc, mingw uses x86_64-w64-mingw32-gcc)
          mkdir -p $HOME/cross-bin
          ln -sf $(brew --prefix)/bin/aarch64-unknown-linux-gnu-gcc $HOME/cross-bin/aarch64-linux-gnu-gcc
          ln -sf $(brew --prefix)/bin/aarch64-unknown-linux-gnu-ar  $HOME/cross-bin/aarch64-linux-gnu-ar
          ln -sf $(brew --prefix)/bin/x86_64-unknown-linux-gnu-gcc  $HOME/cross-bin/x86_64-linux-gnu-gcc
          ln -sf $(brew --prefix)/bin/x86_64-unknown-linux-gnu-ar   $HOME/cross-bin/x86_64-linux-gnu-ar
          echo "$HOME/cross-bin" >> $GITHUB_PATH

      - name: Add `linux` TARGET to kdbc Makefile (cross-compile from Mac)
        run: |
          # Append a TARGET=linux block that mirrors arm64 but for x86_64.
          cat >> kdbc/src/c/Makefile <<'EOF'

          # ---------------------------------------------------------------
          # TARGET=linux — cross-compile linuxX64 from macOS using
          # x86_64-linux-gnu-gcc (provided by messense/macos-cross-toolchains).
          # Required by the Mac-only publish workflow that builds every target
          # on a single host.
          # ---------------------------------------------------------------
          ifeq ($(TARGET),linux)
            CC       = x86_64-linux-gnu-gcc
            AR       = x86_64-linux-gnu-ar
            LDFLAGS  = -ldl -lpthread
            LIB_SHARED = $(BUILDDIR)/libkdbc.so
          endif
          EOF

      - name: Drop host gating in module build files
        run: |
          # stormify/build.gradle.kts and kdbc/build.gradle.kts both gate
          # native targets on host OS. Make them unconditional for this run.
          for f in stormify/build.gradle.kts kdbc/build.gradle.kts logger/build.gradle.kts; do
            python3 - "$f" <<'EOF'
          import sys, re
          p = sys.argv[1]
          src = open(p).read()
          # Remove `if (isLinux) { ... }` and `if (isMac) { ... }` wrappers,
          # leaving the body unconditional. Multiline regex.
          out = re.sub(r'if \(is(Linux|Mac)\) \{\s*\n((?:[^{}]*|\{[^{}]*\})*?)\n\s*\}',
                       lambda m: m.group(2), src, flags=re.MULTILINE)
          open(p, 'w').write(out)
          print(f'Patched {p}')
          EOF
          done
          echo "=== After patch (stormify): ==="
          grep -A 1 "if (is" stormify/build.gradle.kts || echo "All host gating removed in stormify"
          echo "=== After patch (kdbc): ==="
          grep -A 1 "if (is" kdbc/build.gradle.kts || echo "All host gating removed in kdbc"

      - name: Pre-build native C libraries for all targets
        run: |
          cd kdbc/src/c
          # Mac native (already builds with default `make lib` on macOS host)
          make lib
          # Linux x64
          make TARGET=linux BUILDDIR=build-linux lib
          # Linux ARM64
          make TARGET=arm64 BUILDDIR=build-arm64 lib
          # Windows mingw
          make TARGET=mingw BUILDDIR=build-mingw lib
          # iOS device + simulator (already work on macOS)
          make TARGET=ios BUILDDIR=build-ios build-ios/libkdbc.a
          make TARGET=ios-sim BUILDDIR=build-ios-sim build-ios-sim/libkdbc.a
          ls -la build*/libkdbc*

      - name: Publish all targets to local staging
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          gradle \
            :stormify:publishAllPublicationsToLocalStagingRepository \
            :kdbc:publishAllPublicationsToLocalStagingRepository \
            :logger:publishAllPublicationsToLocalStagingRepository \
            :annproc:publishAllPublicationsToLocalStagingRepository \
            --no-daemon --stacktrace

      - name: Show staging stats
        run: |
          echo "Files in staging:"
          find build/staging-deploy -type f | wc -l
          echo ""
          echo "Per-coordinate file count:"
          find build/staging-deploy -type d -name '2.0.1-SNAPSHOT' | while read d; do
            n=$(find "$d" -type f | wc -l | tr -d ' ')
            echo "  $n $(echo $d | sed 's|.*/onl/ycode/||; s|/2.0.1-SNAPSHOT||')"
          done

      - name: Upload to snapshots repo (parallel)
        env:
          USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASS: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd build/staging-deploy
          BASE="https://central.sonatype.com/repository/maven-snapshots"
          export USER PASS BASE
          upload_one() {
            f="$1"
            REL="${f#./}"
            CODE=$(curl -sS -u "$USER:$PASS" -T "$f" -o /dev/null -w '%{http_code}' "$BASE/$REL")
            if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
              echo "FAILED ($CODE): $REL"
              return 1
            fi
            echo "OK $CODE  $REL"
          }
          export -f upload_one
          find . -type f \( -name '*.jar' -o -name '*.pom' -o -name '*.module' \
                            -o -name '*.klib' -o -name '*.aar' -o -name '*.json' \
                            -o -name '*.asc' -o -name '*.md5' -o -name '*.sha1' \
                            -o -name '*.sha256' -o -name '*.sha512' \
                            -o -name 'maven-metadata.xml*' \) -print0 \
            | xargs -0 -n1 -P16 bash -c 'upload_one "$0"' || {
                echo "One or more uploads failed"; exit 1;
              }
          echo ""
          echo "Snapshot published to $BASE/"
